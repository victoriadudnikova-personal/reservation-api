name: reservation-api-dev
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run scripts/start-dev.ps1 first}
    ports:
      - "127.0.0.1:1637:1433"
    volumes:
      - database:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  database:
